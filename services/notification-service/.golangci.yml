version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - errorlint
    - misspell
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
    misspell:
      locale: US

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sidnei-junior/keep-card
