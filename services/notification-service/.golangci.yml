version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - revive
    - gosec
    - errorlint
    - misspell
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sidnei-junior/keep-card
