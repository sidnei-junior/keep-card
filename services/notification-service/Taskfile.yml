version: "3"

tasks:
  lint:
    desc: Run golangci-lint (linters + formatting check)
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint and apply automatic fixes
    cmds:
      - golangci-lint run --fix ./...

  fmt:
    desc: Format code with goimports
    cmds:
      - golangci-lint fmt ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: Run unit and integration tests (requires Docker)
    cmds:
      - go test -tags integration ./...

  coverage:
    desc: Run all tests and report coverage over internal/ (requires Docker)
    cmds:
      - go test -tags integration -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
